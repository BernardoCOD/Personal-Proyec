<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · Nutri</title>
<style>
  :root { --fondo:#f6f7f4; --texto:#1a1d1a; --suave:#5f665f; --acento:#2f8f4e; }

  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--fondo); color:var(--texto);
         font-family:system-ui, sans-serif; text-align:center; padding:16px; }

  p { color:var(--suave); margin:0 0 20px; }
  button { background:var(--acento); color:#fff; border:0; border-radius:12px; padding:10px 18px; font-weight:600; font-size:1rem; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" width="72" height="72" alt="">
    <h1>Sin conexión</h1>

    <button onclick="location.reload()">Reintentar</button>
  </div>

</html>
